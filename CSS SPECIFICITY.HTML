<!DOCTYPE html>
<html>
    <head>
        <title>
            HTML SPECIFICYIY
        </title>
        <link rel="icon" href="/images/favicon.svg" type="image/svg">
        <style>
            #is{
                color: blue;
            }
            .this{
                color:red;
            }
            p{
                color:green;
            }
        </style>
    </head>
    <body>
        <p>This is an example.</p>
         <p class="this">This is an example.</p>
          <p id="is" class="this">This is an example.</p>
           <p id="is" class="this" style="color: pink">This is an example.</p>
    </body>
</html>
