<!DOCTYPE html>
<html>
    <head>
        <title>Learning About Forms</title>
    </head>
    <body>
        <h1 style="text-align: center;"> HTML FORMS</h1>
        <form>
            <label for="fname" >FIRST NAME</label><br>
            <input type="text" id="fname" name="fname" placeholder="Your First Name"><br><br>
            <label for="lname">LAST NAME</label><br>
            <input type="lname" id="lname" name="lname" placeholder="Your Last Name"><br>
            <p>What is your favourite sport?</p>
            <input type="radio" id="Football" name="fav_sport" value="Football">
            <label for="Football">Football</label><br>
            <input type="radio" id="Volleyball" name="fav_sport" value="Volleyball">
            <label for="Volleyball">Volleyball</label><br>
            <input type="radio" id="Cricket" name="fav_sport" value="Cricket">
            <label for="Cricket">Cricket</label><br>
            <input type="radio" id="Basketball" name="fav_sport" value="Basketball">
            <label for="Basketball">Basketball</label>
            <p><b>The following are my belongings:</b></p>
            <input type="checkbox" id="device1" name="device1" value="Laptop">
            <label for="device1">Laptop</label>
            <input type="checkbox" id="device2" name="device2" value="Phone">
            <label for="device2">Phone</label>
            <input type="checkbox" id="device3" name="device3" value="Smartwatch">
            <label for="device3">Smartwatch</label>
            <input type="checkbox" id="device4" name="device4" value="Projector">
            <label for="device4">Projector</label><br><br>
            <input type="checkbox" id="terms_conditions" name="t&c" value="terms_conditions">
            <label for="terms_conditions">I have read the <a href="t&c.html">terms and conditions</a> and fully agree to continue.</label>
            <br><br><br><input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </form>
    </body>
</html>
