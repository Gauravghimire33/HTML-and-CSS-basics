<!DOCTYPE html>
<html>
    <head>
        <title> CSS FLEXBOX LAYOUT</title>
        <link rel="icon" href="/images/favicon.svg" type="image/svg">
        <style>
            .container {
                display: flex;
                background-color: mediumpurple;
                /* flex-direction: column; */
                /* flex-wrap: wrap; */
                flex-flow: row wrap;
                justify-content: space-around;
                height: 200px;
                align-content: center;
            }
            .container div{
                background-color: lightblue;
                margin: 10px;
                padding: 20px;
                font-size: 25px;
            }
        </style>    
    </head>
    <body>
        <div class="container">
            <div style="order:3 ">Home Page</div>
            <div style="order:4">Programs</div>
            <div style="order:2">Faculty and Staff</div>
            <div style="order:1; flex-grow: 3">Contact Us</div>
        </div>
        
    </body>
</html>
