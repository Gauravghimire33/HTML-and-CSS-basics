<!DOCTYPE html>
<html>
    <head>
        <title>HTML GRID</title>
        <link rel="icon" href="/images/favicon.svg" type="image/svg">
        <style>
            .container{
                display: grid;
                background-color: palegoldenrod;
                padding: 10px;
                grid-template-columns: auto auto auto;
            
            }
            .container div{
                border: 1px solid black;
                padding: 20px;
                font-size: 25px;
                background-color: lightblue;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
        </div>
    </body>
</html>
